<div style="padding-left: 1rem;padding-right: 2rem;">

    <h2>Juegos Eliminados ({{auditList().length}})</h2>
    
    
    <div style="display: flex;flex-direction: column; gap: 2rem;">
        @for (item of auditList(); track $index) {
            <div>
                <h2 style="margin: 0;">Juego {{(item.licenseinfo??{}).gid ?? 0}} Eliminado Por {{item.deleter}}</h2>
            </div>
        }
    </div>
    
    
</div>
