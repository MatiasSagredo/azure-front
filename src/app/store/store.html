<div style="padding-left: 1rem;padding-right: 2rem;">

    <h2>Juegos</h2>
    
    
    <div style="display: grid;grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));">
        @for (item of gameList(); track $index) {
            <div>
                <img width="350" height="250" [src]=item.background_image/>
                <h2 style="margin: 0;">{{item.name}}</h2>
                @if (sessionType() != 0){
                <button (click)="comprar(item.id)">Añadir a biblioteca</button>
                }
            </div>
        }
    </div>
    
    
</div>
