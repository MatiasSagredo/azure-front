<header>
  <div class="header-content">
    <a class="brand" routerLink="/" aria-label="VidalStore, ir a la tienda">
      <span class="brand-name">Vidal<span>Store</span></span>
    </a>
    <nav class="main-nav">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"
        ariaCurrentWhenActive="page" class="header-btn">
        Tienda
      </a>

      @if (sessionType() != 0 ){
      <a routerLink="/library" routerLinkActive="active" ariaCurrentWhenActive="page" class="header-btn">
        Biblioteca
      </a>
      @if (sessionType() > 1 ){
      <a routerLink="/admin" routerLinkActive="active" ariaCurrentWhenActive="page" class="header-btn">
        Admin licencias
      </a>
      <a routerLink="/auditing" routerLinkActive="active" ariaCurrentWhenActive="page" class="header-btn">
        Auditoría
      </a>
      }

      }


      <div class="session-actions">
        @if (sessionType() != 0 ){
        <button (click)="logout()">Cerrar Sesion</button>
        }
        @else{<button (click)="login()">Iniciar Sesion</button>}
      </div>
    </nav>
  </div>
</header>

<main>
  <router-outlet />
</main>
